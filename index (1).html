<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaam Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Design: dark-first glassmorphism. Frosted panels float over a soft teal, gold and indigo glow.
   Gold is the single action colour, teal is the secondary, green is for calling. Large touch targets stay for low-literacy use. */
:root{
  --bg1:#06141A; --bg2:#0A2530; --b1:#12A6A8; --b2:#E9B24A; --b3:#4C6FFF; --blobo:.5;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.13); --edge:rgba(255,255,255,.17); --line:rgba(255,255,255,.22);
  --ink:#F1F7F8; --mute:#A8BEC5;
  --gold1:#F8DA7C; --gold2:#E6A62C; --gold-ink:#2A1D00;
  --teal1:#15A0A6; --teal2:#0B6B74; --ok1:#3EE0A6; --ok2:#12A874; --ok-ink:#032619; --danger:#FF6B5E;
  --shadow:0 12px 32px rgba(0,0,0,.35); --hl:inset 0 1px 0 rgba(255,255,255,.18);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Tamil","Noto Sans Kannada","Noto Sans Bengali",sans-serif;
  --glow:rgba(230,166,44,.35); --gtext:var(--gold1);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root{--bg1:#EEF6F7; --bg2:#D6E8EC; --b1:#6CD3D5; --b2:#F6D58A; --b3:#9DB4FF; --blobo:.75;
    --glass:rgba(255,255,255,.6); --glass2:rgba(255,255,255,.8); --edge:rgba(255,255,255,.95); --line:rgba(16,37,44,.2);
    --ink:#10252C; --mute:#4A6068; --danger:#C62828;
    --shadow:0 12px 32px rgba(24,60,72,.15); --hl:inset 0 1px 0 rgba(255,255,255,.95); --gtext:#9A6500; color-scheme:light}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);font-family:var(--font);
  font-size:18px;line-height:1.45;padding-bottom:120px;min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold1);outline-offset:2px}
.i{width:1.2em;height:1.2em;flex:0 0 auto;vertical-align:-.2em}

/* ambient glow behind the glass */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--blobo)}
.bg i:nth-child(1){width:340px;height:340px;background:var(--b1);top:-90px;left:-110px}
.bg i:nth-child(2){width:300px;height:300px;background:var(--b2);top:36%;right:-120px;opacity:calc(var(--blobo) * .7)}
.bg i:nth-child(3){width:380px;height:380px;background:var(--b3);bottom:-140px;left:10%;opacity:calc(var(--blobo) * .6)}
@media (prefers-reduced-motion:no-preference){.bg i{animation:drift 22s ease-in-out infinite alternate}.bg i:nth-child(2){animation-duration:28s}.bg i:nth-child(3){animation-duration:34s}}
@keyframes drift{to{transform:translate3d(40px,30px,0)}}

/* glass surface, shared */
.glass,header.top,.card,.tile,.cat,.rule,.check,.msg.bot .mb,.note,.chip,.seg button,.yn span,.searchbar input,form input[type=text],form input[type=number],form select,nav.tabs .wrap,.sheet,.pill{
  background:var(--glass);border:1px solid var(--edge);box-shadow:var(--hl),var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,header.top,.card,.tile,.cat,.rule,.check,.msg.bot .mb,.note,.chip,.seg button,.yn span,.searchbar input,form input[type=text],form input[type=number],form select,nav.tabs .wrap,.sheet,.pill{background:var(--bg2)}
}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;border-width:0 0 1px 0;border-radius:0;box-shadow:var(--hl)}
header.top .wrap{display:flex;align-items:center;gap:6px;min-height:64px;flex-wrap:nowrap;padding-block:8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15.5px;letter-spacing:-.02em;flex:1;min-width:0;gap:8px}
.logo>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .mark{flex:0 0 auto}
@media (max-width:370px){.logo>span:last-child{display:none}}
.logo b{font-weight:800;color:var(--gold1);margin-left:2px}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--gold-ink);display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:0 6px 16px var(--glow)}
.logo .mark::after{content:"K"}
select#lang{min-height:46px;border-radius:14px;padding:0 6px;max-width:94px;font-size:16px;font-weight:600;border:1px solid var(--line);background:var(--glass2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hbtn{position:relative;flex:0 0 auto;min-width:44px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);display:grid;place-items:center}
.hbtn .i{width:23px;height:23px}
[hidden]{display:none!important}
.badge-n{position:absolute;top:-6px;right:-6px;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--gold-ink);font-size:12px;font-weight:800;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px}

main{padding-block:20px}
h1.hello{font-size:28px;line-height:1.2;letter-spacing:-.02em;margin:4px 0 14px;font-weight:800;text-wrap:balance}
h2{font-size:13px;margin:26px 0 12px;color:var(--mute);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 14px;font-size:14px;font-weight:600;color:var(--mute)}
.pill .i{color:var(--gold1)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{min-height:156px;border-radius:24px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:14px;font-weight:800;font-size:19px;text-align:left;padding:18px;line-height:1.2;position:relative;overflow:hidden;color:var(--ink)}
.tile .ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--edge);color:var(--gold1)}
.tile .ic .i{width:30px;height:30px}
.tile.t1{background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);border-color:rgba(255,255,255,.4)}
.tile.t1 .ic{background:rgba(42,29,0,.14);border-color:rgba(42,29,0,.18);color:var(--gold-ink)}
.tile.t2{background:linear-gradient(145deg,rgba(21,160,166,.85),color-mix(in srgb,var(--teal2) 45%,transparent));color:#fff;border-color:rgba(255,255,255,.3)}
.tile.t2 .ic{color:#fff;background:rgba(255,255,255,.18)}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.cat{min-height:98px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:8px;overflow-wrap:anywhere;text-align:center}
.cat span{font-size:30px;line-height:1}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;padding:5px;border-radius:20px;background:var(--glass);border:1px solid var(--edge)}
.seg button{min-height:52px;border-radius:15px;font-weight:700;border-color:transparent;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute)}
.seg button.on{background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);box-shadow:0 6px 16px var(--glow)}

.searchbar{display:flex;gap:10px}
.searchbar input{flex:1;min-width:0;min-height:58px;border-radius:18px;padding:0 18px;font-size:18px}
.searchbar input::placeholder,form input::placeholder{color:var(--mute);opacity:.85}
.mic{width:58px;min-height:58px;border-radius:18px;border:0;background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);display:grid;place-items:center;box-shadow:0 8px 20px var(--glow)}
.mic .i{width:26px;height:26px}
.mic.on{background:linear-gradient(145deg,#FF8A7E,var(--danger));color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:44px;border-radius:99px;padding:0 16px;font-weight:600;font-size:16px;white-space:nowrap;box-shadow:var(--hl)}
.chip.on{background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);border-color:transparent}

.card{display:grid;grid-template-columns:60px 1fr;gap:4px 14px;border-radius:24px;padding:16px;margin-bottom:14px}
.card .av{font-size:32px;width:60px;height:60px;border-radius:18px;background:var(--glass2);border:1px solid var(--edge);display:grid;place-items:center}
.card .grow{min-width:0}
.card h3{margin:0;font-size:19px;line-height:1.25;overflow-wrap:anywhere;font-weight:700;letter-spacing:-.01em}
.sub{margin:3px 0 0;color:var(--mute);font-size:15px}
.sub .i{width:1em;height:1em;vertical-align:-.12em}
.star{color:var(--gold1)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ok1);border:1px solid color-mix(in srgb,var(--ok1) 55%,transparent);background:color-mix(in srgb,var(--ok1) 12%,transparent);border-radius:99px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.badge .i{width:13px;height:13px}
@media (prefers-color-scheme:light){.badge{color:#0A7A52}}
.actions{grid-column:1 / -1;display:flex;gap:10px;margin-top:10px}
.btn{min-height:58px;border:0;border-radius:18px;font-weight:800;font-size:17px;padding:0 18px;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:10px;color:#fff;
  background:linear-gradient(145deg,var(--teal1),var(--teal2));box-shadow:0 8px 20px color-mix(in srgb,var(--teal2) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.28)}
.btn .i{width:22px;height:22px}
.btn.call{background:linear-gradient(145deg,var(--ok1),var(--ok2));color:var(--ok-ink);box-shadow:0 8px 20px rgba(18,168,116,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.hi{background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);box-shadow:0 8px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.alt{flex:0 0 58px;padding:0;background:var(--glass2);color:var(--ink);border:1px solid var(--line);box-shadow:var(--hl)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line);box-shadow:var(--hl)}
.btn[disabled]{opacity:.55;cursor:default}
.pay{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em;color:var(--gold1)}
.pay .sub{display:inline;font-weight:600;letter-spacing:0}
@media (prefers-color-scheme:light){.pay{color:var(--gtext)}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:13px;font-weight:600;background:var(--glass2);border:1px solid var(--edge);border-radius:99px;padding:3px 10px}

form .f{margin-bottom:18px}
form label.l{display:block;font-weight:700;font-size:15px;color:var(--mute);margin-bottom:8px}
form input[type=text],form input[type=number],form select{width:100%;min-height:58px;border-radius:18px;padding:0 18px;font-size:18px}
form input:focus,form select:focus,.searchbar input:focus{border-color:var(--gold1);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold1) 35%,transparent)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn label{position:relative}
.yn input{position:absolute;opacity:0;inset:0}
.yn span{display:grid;place-items:center;min-height:58px;border-radius:18px;font-weight:700}
.yn input:checked+span{background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);border-color:transparent}
.yn input:focus-visible+span{outline:3px solid var(--gold1);outline-offset:2px}
.check{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px}
.check input{width:26px;height:26px;flex:0 0 auto;margin-top:2px;accent-color:#E6A62C}
.check a{color:var(--gold1);font-weight:700}
@media (prefers-color-scheme:light){.check a{color:var(--gtext)}}
.rule{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;border-radius:20px;padding:16px;margin-bottom:12px}
.rule .ic{font-size:28px;width:48px;height:48px;border-radius:15px;background:var(--glass2);border:1px solid var(--edge);display:grid;place-items:center;color:var(--gold1)}
.rule .ic .i{width:24px;height:24px}

.chathead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.botav{width:48px;height:48px;border-radius:50%;background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 16px var(--glow)}
.botav .i{width:24px;height:24px}
.botav.sm{width:34px;height:34px}
.botav.sm .i{width:18px;height:18px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok1);margin-right:6px;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok1) 25%,transparent)}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:8px;min-height:200px}
.msg{max-width:88%;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;padding:12px 16px;border-radius:20px 20px 6px 20px;background:linear-gradient(145deg,var(--teal1),var(--teal2));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--teal2) 45%,transparent)}
.msg.bot{display:flex;gap:10px;align-items:flex-start;max-width:94%}
.msg.bot .mb{border-radius:6px 20px 20px 20px;padding:14px 16px;min-width:0;overflow-wrap:anywhere}
.mb .btn{margin-top:10px;min-height:50px;width:100%;flex:none;font-size:16px}
.say{display:flex;align-items:center;margin-top:8px;border:0;background:none;color:var(--mute);padding:4px 0}
.say .i{width:22px;height:22px}
.typing{display:flex;gap:6px;padding:18px 18px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.row{display:flex;gap:10px;margin-top:14px}
.note{padding:14px;border-radius:16px;color:var(--mute);font-size:14px;margin-top:12px;box-shadow:none}
.empty{text-align:center;color:var(--mute);padding:36px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .wrap{pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px;border-radius:28px;max-width:600px;margin-left:auto;margin-right:auto;width:calc(100% - 32px);padding-left:6px;padding-right:6px}
nav.tabs button{border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--mute);border-radius:22px;overflow-wrap:anywhere;line-height:1.15;padding:4px 2px}
nav.tabs button span{display:grid;place-items:center}
nav.tabs button .i{width:25px;height:25px}
nav.tabs button.on{color:var(--gold-ink);background:linear-gradient(145deg,var(--gold1),var(--gold2));box-shadow:0 6px 16px var(--glow)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(3,10,14,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px}
.sheet{width:100%;max-width:420px;border-radius:32px;padding:26px 22px;text-align:center;background:var(--glass2)}
.sheet .big{width:96px;height:96px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:var(--glass);border:1px solid var(--edge)}
.sheet h3{margin:6px 0;font-size:22px}
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0}
@media (prefers-color-scheme:light){.logo b,.tile .ic,.pill .i,.rule .ic{color:var(--gtext)}.star{color:#B87800}}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);background:rgba(8,20,26,.88);color:#F1F7F8;padding:12px 18px;border-radius:16px;z-index:30;max-width:90%;text-align:center;border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-weight:600}

/* landing, auth, role screens */
@media (max-width:460px){#hdr.in .logo>span:last-child{display:none}}
.hbtn.av{font-weight:800;font-size:18px;border:0;background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink)}
.hbtn.txt{padding:0 18px;font-weight:800;font-size:16px;border:0;background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink)}
.hero{padding:8px 0 0}
.hero h1{font-size:clamp(34px,9.5vw,50px);line-height:1.06;letter-spacing:-.035em;margin:6px 0 14px;font-weight:800;text-wrap:balance}
.hero p{color:var(--mute);font-size:18px;margin:0 0 22px;max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.cta .btn{flex:1 1 150px}
.roles{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.roles{grid-template-columns:1fr 1fr}}
.rolecard{border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px}
.rolecard h3{margin:0;font-size:21px;letter-spacing:-.01em}
.rolecard .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--edge);color:var(--gold1)}
.rolecard .ic .i{width:28px;height:28px}
.rolecard ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;color:var(--mute);font-size:16px;flex:1}
.rolecard li{display:flex;gap:10px;align-items:flex-start}
.rolecard li .i{color:var(--ok1);margin-top:2px}
.rule .ic{font-weight:800;font-size:22px}
.tile small{font-weight:600;font-size:15px;opacity:.85}
.phonef{display:flex;gap:10px}
.phonef .cc{display:grid;place-items:center;padding:0 16px;border-radius:18px;font-weight:800;min-height:58px}
.phonef input[type=text]{width:auto;flex:1;min-width:0}
form input[type=text].otp{text-align:center;font-size:32px;font-weight:800;letter-spacing:.45em;padding:0 0 0 .45em;min-height:68px}
.st{display:inline-flex;align-items:center;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:700;border:1px solid var(--line);vertical-align:middle}
.st.ok{color:var(--ok1);border-color:color-mix(in srgb,var(--ok1) 55%,transparent);background:color-mix(in srgb,var(--ok1) 12%,transparent)}
.st.no{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
.st.wait{color:var(--gold1);border-color:color-mix(in srgb,var(--gold1) 55%,transparent)}
@media (prefers-color-scheme:light){.st.ok{color:#0A7A52}.st.wait{color:var(--gtext)}.rolecard .ic{color:var(--gtext)}.rolecard li .i{color:#0A7A52}}
.appl{grid-column:1 / -1;display:grid;gap:4px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.arow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 0}
.arow+.arow{border-top:1px solid var(--line)}
.arow .head{display:flex;gap:12px;align-items:center;flex:1 1 100%;min-width:0}
.arow .who{min-width:0;overflow-wrap:anywhere}
.av2{width:44px;height:44px;border-radius:14px;background:var(--glass2);border:1px solid var(--edge);display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.arow .btn{min-height:48px;font-size:15px;padding:0 12px}
.arow .btn.call{flex:0 0 52px;padding:0}
.appl-card{display:block;padding:6px 16px}

/* role themes: workers get warm gold and teal, employers get cool cyan and indigo */
html[data-role=employer]{--gold1:#8DEAF0;--gold2:#14A7BF;--gold-ink:#03242B;--teal1:#5568F0;--teal2:#3340C8;--b1:#4C6FFF;--b2:#14A7BF;--b3:#8B5CF6;--glow:rgba(20,167,191,.38)}
@media (prefers-color-scheme:light){html[data-role=employer]{--gtext:#0B6E80;--b1:#9DB4FF;--b2:#7FE0EA;--b3:#C3B0FF}}
html[data-role] header.top{border-bottom-color:color-mix(in srgb,var(--gold1) 55%,transparent)}
/* worker home */
.voicehero{border-radius:28px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center;text-align:center;margin-bottom:6px}
.voicehero p{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.bigmic{width:92px;height:92px;border-radius:50%;border:0;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold1),var(--gold2));color:var(--gold-ink);box-shadow:0 12px 30px var(--glow),0 0 0 10px color-mix(in srgb,var(--gold1) 18%,transparent)}
.bigmic .i{width:42px;height:42px}
.bigmic.on{background:linear-gradient(145deg,#FF8A7E,var(--danger));color:#fff;animation:pulse 1s infinite}
@media (prefers-reduced-motion:reduce){.bigmic.on{animation:none}}
.voicehero .searchbar{width:100%;min-width:0}
/* employer home */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:4px;text-align:left;color:var(--ink)}
.stat b{font-size:38px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:14px;font-weight:600}
.stat.alert{border-color:var(--gold1);box-shadow:var(--hl),0 0 0 2px color-mix(in srgb,var(--gold1) 40%,transparent),var(--shadow)}
.stat.alert b{color:var(--gtext)}
.joblist{border-radius:22px;padding:4px 14px}
.jrow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 0;text-align:left;color:var(--ink)}
.jrow+.jrow{border-top:1px solid var(--line)}
.jrow .jt{flex:1;min-width:0;display:flex;flex-direction:column}
.jrow .jt b{overflow-wrap:anywhere}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.mini{flex:0 0 240px;scroll-snap-align:start;border-radius:22px;padding:14px;display:grid;gap:12px}
.mini .head{display:flex;gap:10px;align-items:center;min-width:0}
.mini .who{min-width:0;overflow-wrap:anywhere}
.mini .btn{min-height:48px;font-size:15px}
</style>

function matchCat(q){
  q=(q||'').trim().toLowerCase(); if(q.length<2)return null;
  for(const c of CATS){
    const names=[c.id,...Object.values(c.n)].map(n=>n.toLowerCase());
    if(names.some(n=>q.includes(n)||n.includes(q)))return c.id;

  return null;
}

/* ---------- voice in and out (browser Web Speech API) ---------- */
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang=LANGS[state.lang].sr;speechSynthesis.speak(u);
}
function listen(btn,onText){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast(t('no_voice'));return}
  const r=new SR();r.lang=LANGS[state.lang].sr;r.interimResults=false;
  btn.classList.add('on');toast(t('listening'));
  r.onresult=e=>onText(e.results[0][0].transcript);
  r.onerror=()=>toast(t('mic_denied'));
  r.onend=()=>btn.classList.remove('on');
  try{r.start()}catch(e){btn.classList.remove('on')}
}

function addNotif(text,to){
  to=to||(state.user&&state.user.phone);if(!to)return;
  state.notifs.unshift({id:Date.now()+Math.random(),text,to,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),read:0});
  state.notifs=state.notifs.slice(0,60);store.set('notifs',state.notifs);
  try{if(state.user&&to===state.user.phone&&'Notification' in window&&Notification.permission==='granted')new Notification('Kaam Connect',{body:text})}catch(e){}
  updateBadge();
}

const KW={
 apply:['apply','application','आवेदन','अप्लाई','దరఖాస్తు','விண்ணப்ப','ಅರ್ಜಿ','আবেদন','अर्ज'],
 rules:['rule','terms','child','legal','नियम','నియమ','விதி','ನಿಯಮ','নিয়ম'],
 post:['post a job','post job','hire','काम डाल','పోస్ట్','பதிவிட','ಕೆಲಸ ಹಾಕಿ','কাজ দিন','काम टाका'],
 call:['call','phone','कॉल','फोन','కాల్','அழை','ಕರೆ','কল'],
 pay:['pay','salary','wage','rate','मजदूरी','वेतन','జీతం','వేతనం','சம்பளம்','ಸಂಬಳ','মজুরি','मजुरी','किती पैसे'],
 alerts:['alert','notif','सूचना','సమాచారం','அறிவிப்பு','ಸೂಚನೆ','বার্তা']
};
const WORDS={
 greet:['hi','hii','hello','hey','hola','namaste','नमस्ते','నమస్తే','வணக்கம்','ನಮಸ್ಕಾರ','নমস্কার','नमस्कार'],
 thanks:['thanks','thank','thx','धन्यवाद','शुक्रिया','ధన్యవాదాలు','நன்றி','ಧನ್ಯವಾದ','ধন্যবাদ','आभार']
};
const CHIPS=()=>{const u=state.user;
  if(u&&u.role==='worker')return [['cat:'+u.skill,cname(u.skill)],['apply',t('ch_apply')],['pay',t('ch_pay')],['rules',t('rules')]];
  return [['cat:plumber',cname('plumber')],['post',t('post_job')],['call',t('ch_call')],['pay',t('ch_pay')],['rules',t('rules')]]};
const anyIn=(q,list)=>list.some(w=>q.includes(w));
const tokens=q=>q.split(/[\s,.!?।]+/).filter(Boolean);
function avgPay(cat){const l=state.jobs.filter(j=>j.cat===cat);return l.length?Math.round(l.reduce((a,j)=>a+j.pay,0)/l.length):0}
const isE=()=>!!(state.user&&state.user.role==='employer');
function foundReply(cat){
  const n=isE()?WORKERS.filter(w=>w.cat===cat).length:state.jobs.filter(j=>j.cat===cat&&!j.closed).length;
  return{text:t('as_found',{c:cname(cat),n}),acts:[isE()?{label:t('find_worker'),v:'find',cat}:{label:t('find_work'),v:'find',cat}]};
}
function payReply(cat){const p=avgPay(cat);return p?{text:t('as_pay',{c:cname(cat),p}),acts:[isE()?{label:t('find_worker'),v:'find',cat}:{label:t('find_work'),v:'find',cat}]}:foundReply(cat)}
function intentReply(k){
  state.ctx='';
  switch(k){
   case 'greet':return{text:t('as_greet')};
   case 'thanks':return{text:t('as_thanks')};
   case 'apply':return isE()?{text:t('as_apply_e'),acts:[{label:t('my_jobs'),v:'myjobs'}]}:{text:t('as_apply'),acts:[{label:t('find_work'),v:'find'}]};
   case 'call':return isE()?{text:t('as_call'),acts:[{label:t('find_worker'),v:'find'}]}:{text:t('as_call_w'),acts:[{label:t('find_work'),v:'find'}]};
   case 'post':return isE()?{text:t('as_post'),acts:[{label:t('post_job'),v:'post'}]}:{text:t('as_post_w'),acts:[{label:t('find_work'),v:'find'}]};
   case 'rules':return{text:[t('t1'),t('t2'),t('t3'),t('t4')].join(' '),acts:[{label:t('rules'),v:'rules'}]};
   case 'alerts':return{text:t('as_alerts'),acts:[{label:t('alerts'),v:'alerts'}]};
   case 'pay':state.ctx='pay';return{text:t('as_pay_ask')};
  }
  if(k.startsWith('cat:'))return foundReply(k.slice(4));
  return{text:t('as_default')};
}
function botReply(text){
  const q=text.toLowerCase().trim(), tk=tokens(q), mc=matchCat(q);
  if(tk.length&&tk.length<=3&&tk.some(w=>WORDS.greet.includes(w)))return intentReply('greet');
  if(anyIn(q,WORDS.thanks))return intentReply('thanks');
  if(anyIn(q,KW.pay)){if(mc){state.ctx='';return payReply(mc)}return intentReply('pay')}
  if(state.ctx==='pay'&&mc){state.ctx='';return payReply(mc)}
  for(const k of ['rules','apply','post','call','alerts'])if(anyIn(q,KW[k]))return intentReply(k);
  if(mc){state.ctx='';return foundReply(mc)}
  state.ctx='';return{text:t('as_default')};
}
function drawChat(){
  if(!state.chat.length)state.chat.push({who:'bot',...intentReply('greet')});
  const el=$('#chatlist');if(!el)return;
  el.innerHTML=state.chat.map((m,i)=>m.who==='me'
   ?`<div class="msg me">${esc(m.text)}</div>`
   :`<div class="msg bot"><span class="botav sm">${ic('chat')}</span><div class="mb">${esc(m.text)}${(m.acts||[]).map((a,j)=>`<button class="btn hi" data-act="chatgo" data-i="${i}" data-j="${j}">${esc(a.label)} →</button>`).join('')}<button class="say" data-act="say" data-v="${esc(m.text)}" aria-label="${esc(t('read'))}">${ic('speaker')}</button></div></div>`).join('')
   +(state.typing?`<div class="msg bot"><span class="botav sm">${ic('chat')}</span><div class="mb typing"><i></i><i></i><i></i></div></div>`:'');
  el.lastElementChild&&el.lastElementChild.scrollIntoView({block:'nearest'});
}
function sendChat(text,voice,key){
  text=text.trim();if(!text)return;
  state.chat.push({who:'me',text});state.typing=true;drawChat();
  setTimeout(()=>{
    const r=key?intentReply(key):botReply(text);
    state.chat.push({who:'bot',...r});state.typing=false;drawChat();
    if(voice)speak(r.text);
  },550);
}
function chipSend(key,label){sendChat(label,false,key)}

  const a=state.auth,p=a.prof,w=a.role==='worker';
  if(a.step==='otp')return `<h1 class="hello">${esc(t('create'))}</h1>`+otpBlock();
  if(a.step==='role')return `<h1 class="hello">${esc(t('create'))}</h1><h2>${esc(t('who'))}</h2>
   <div class="tiles"><button class="tile t1" data-act="role" data-v="worker"><span class="ic">${ic('tool')}</span>${esc(t('worker_role'))}<small>${esc(t('i_work'))}</small></button>
   <button class="tile t2" data-act="role" data-v="employer"><span class="ic">${ic('building')}</span>${esc(t('employer_role'))}<small>${esc(t('i_hire'))}</small></button></div>
   <div class="row"><button class="btn ghost" data-act="open" data-v="login">${esc(t('have_acct'))}</button></div>`;
  return `<h1 class="hello">${esc(t(w?'worker_role':'employer_role'))}</h1><form id="rf" novalidate>
   <div class="f"><label class="l" for="r_name">${esc(t('full_name'))}</label><input type="text" id="r_name" autocomplete="name" value="${esc(p.name||'')}"></div>
   ${w?'':`<div class="f"><label class="l" for="r_biz">${esc(t('biz'))}</label><input type="text" id="r_biz" value="${esc(p.biz||'')}"></div>
   <div class="f"><label class="l" for="r_etype">${esc(t('etype'))}</label><select id="r_etype"><option value="indiv" ${p.etype==='company'?'':'selected'}>${esc(t('indiv'))}</option><option value="company" ${p.etype==='company'?'selected':''}>${esc(t('company'))}</option></select></div>`}
   <div class="f"><label class="l" for="r_phone">${esc(t('phone'))}</label>${phoneField('r_phone',p.phone)}</div>
   ${w?`<div class="f"><label class="l" for="r_skill">${esc(t('skill'))}</label><select id="r_skill">${CATS.map(c=>`<option value="${c.id}" ${p.skill===c.id?'selected':''}>${c.ic} ${esc(cname(c.id))}</option>`).join('')}</select></div>
   <div class="f"><label class="l" for="r_exp">${esc(t('exp'))}</label><input type="number" id="r_exp" inputmode="numeric" min="0" max="60" value="${esc(p.exp||'')}"></div>`:''}
   <div class="f"><label class="l" for="r_area">${esc(t('area'))}</label><input type="text" id="r_area" autocomplete="address-level2" value="${esc(p.area||'')}"></div>
   ${w?`<div class="f"><label class="check"><input type="checkbox" id="r_age"><span>${esc(t('age18'))}</span></label></div>`:''}
   <div class="f"><label class="check"><input type="checkbox" id="r_agree"><span>${esc(t('agree'))}<br><a href="#" data-act="goto" data-v="rules">${ic('scale')} ${esc(t('rules'))}</a></span></label></div>
   <button class="btn hi" style="width:100%" type="submit">${esc(t('send_otp'))}</button></form>
   <div class="row"><button class="btn ghost" data-act="authback">${ic('back')} ${esc(t('back'))}</button></div>`;
};
function authSubmit(fid){
  const a=state.auth,v=id=>{const e=$('#'+id);return e?e.value.trim():''};
  if(fid==='lf'){
    const p=v('l_phone');
    if(!phoneOk(p))return toast(t('bad_phone'));
    if(!state.users.some(u=>u.phone===p))return toast(t('no_acct'));
    a.phone=p;startOtp();a.step='otp';render();
  }else if(fid==='rf'){
    const p=v('r_phone'),name=v('r_name'),area=v('r_area'),w=a.role==='worker';
    if(!name)return toast(t('err_name'));
    if(!phoneOk(p))return toast(t('bad_phone'));
    if(!area)return toast(t('err_area'));
    if(state.users.some(u=>u.phone===p))return toast(t('has_acct'));
    if(w&&!$('#r_age').checked)return toast(t('err_age'));
    if(!$('#r_agree').checked)return toast(t('err_agree'));
    a.prof=w?{role:'worker',name,phone:p,area,skill:v('r_skill'),exp:+v('r_exp')||0}
            :{role:'employer',name,phone:p,area,biz:v('r_biz')||name,etype:v('r_etype')};
    a.phone=p;startOtp();a.step='otp';render();
  }else if(fid==='of'){
    if(Date.now()>a.exp)return toast(t('otp_exp'));
    a.tries++;
    if(v('o_code')!==a.code){if(a.tries>=5)a.exp=0;return toast(t('bad_otp'))}
    let u;
    if(a.mode==='register'){u={...a.prof,created:Date.now()};state.users.push(u);store.set('users',state.users)}
    else u=state.users.find(x=>x.phone===a.phone);
    state.user=u;store.set('session',u.phone);state.view='home';state.chat=[];state.cat='';state.q='';
    render();toast(a.mode==='register'?t('acct_ok'):t('hello',{n:u.name}));
  }
}
setInterval(()=>{const b=$('#rs');if(!b||!state.auth)return;const s=Math.max(0,30-Math.floor((Date.now()-state.auth.sent)/1000));b.disabled=s>0;b.textContent=s?t('resend_in',{s}):t('resend')},1000);

/* ---------- landing page (shown before login) ---------- */
V.landing=()=>`<section class="hero"><div class="pills"><span class="pill">${ic('shield')}${esc(t('verified'))}</span><span class="pill">${ic('lock')}OTP</span></div>
 <h1>${esc(t('l_h'))}</h1><p>${esc(t('l_p'))}</p>
 <div class="cta"><button class="btn hi" data-act="open" data-v="register">${esc(t('register'))}</button><button class="btn ghost" data-act="open" data-v="login">${esc(t('login'))}</button></div></section>
<div class="pills" style="margin-top:22px">${CATS.map(c=>`<span class="pill">${c.ic} ${esc(cname(c.id))}</span>`).join('')}</div>
<h2>${esc(t('who'))}</h2>
<div class="roles">
 <article class="rolecard glass"><span class="ic">${ic('tool')}</span><h3>${esc(t('i_work'))}</h3>
  <ul>${['w_b1','w_b2','w_b3'].map(k=>`<li>${ic('check')}<span>${esc(t(k))}</span></li>`).join('')}</ul>
  <button class="btn hi" data-act="regrole" data-v="worker">${esc(t('register'))}</button></article>
 <article class="rolecard glass"><span class="ic">${ic('building')}</span><h3>${esc(t('i_hire'))}</h3>
  <ul>${['e_b1','e_b2','e_b3'].map(k=>`<li>${ic('check')}<span>${esc(t(k))}</span></li>`).join('')}</ul>
  <button class="btn" data-act="regrole" data-v="employer">${esc(t('register'))}</button></article>
</div>
<h2>${esc(t('how'))}</h2>
${['s1','s2','s3'].map((k,i)=>`<div class="rule"><span class="ic">${i+1}</span><div>${esc(t(k))}</div></div>`).join('')}
<h2>${esc(t('safe_t'))}</h2>
${[['shield','t1'],['check','t2'],['lock','t3'],['scale','t4']].map(([i,k])=>`<div class="rule"><span class="ic">${ic(i)}</span><div>${esc(t(k))}</div></div>`).join('')}`;

/* ---------- profile ---------- */
V.profile=()=>{
  const u=state.user,w=u.role==='worker';
  const row=(i,main,sub)=>`<div class="rule"><span class="ic">${ic(i)}</span><div>${main}<p class="sub">${esc(sub)}</p></div></div>`;
  return `<div class="chathead"><span class="botav" style="width:64px;height:64px;font-size:28px;font-weight:800">${esc(u.name.trim()[0].toUpperCase())}</span>
  <div><h1 class="hello" style="margin:0">${esc(u.name)}</h1><span class="pill" style="margin-top:6px">${esc(t(w?'role_w':'role_e'))}</span></div></div>
  ${row('phone','+91 '+esc(u.phone),t('phone'))}${row('pin',esc(u.area),t('area'))}
  ${w?row('tool',`${cicon(u.skill)} ${esc(cname(u.skill))} · ${esc(u.exp)} yr`,t('skill')):row('building',esc(u.biz),t('biz'))}
  <p class="note">${ic('lock')} ${esc(t('hidden'))}</p>
  <div class="row"><button class="btn ghost" data-act="logout">${ic('logout')} ${esc(t('logout'))}</button></div>`;
};

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='open'||a==='tab'){e.preventDefault();captureReg();if(v==='login'||v==='register')resetAuth(v);state.view=v;if(a==='tab')state.cat='';render();window.scrollTo(0,0)}
  else if(a==='mode'){state.mode=v;render()}
  else if(a==='cat'){state.cat=v;render()}
  else if(a==='catgo'){state.view='find';state.mode='worker';state.cat=v;state.q='';render()}
  else if(a==='say')speak(v);
  else if(a==='mic')listen(b,txt=>{state.q=txt;const i=$('#q');if(i)i.value=txt;const mc=matchCat(txt);if(mc)state.cat='';render()});
  else if(a==='cmic')listen(b,txt=>sendChat(txt,true));
  else if(a==='csend'){const i=$('#ci');sendChat(i.value,false);i.value=''}
  else if(a==='chatgo'){const ac=state.chat[+b.dataset.i].acts[+b.dataset.j];state.view=ac.v;if(ac.m)state.mode=ac.m;state.cat=ac.cat||'';state.q='';render()}
  else if(a==='chip')chipSend(v,b.dataset.l)
  else if(a==='call')startCall(WORKERS.find(x=>x.id===+v));
  else if(a==='endcall')endCall();
  else if(a==='apply'){state.modal={type:'apply',id:+v};drawLayer()}
  else if(a==='cancel'){state.modal=null;drawLayer()}
  else if(a==='applyok'){
    const j=state.jobs.find(x=>x.id===state.modal.id),u=state.user;
    if(j&&u&&u.role==='worker'&&!state.apps.some(x=>x.jobId===j.id&&x.wphone===u.phone)){
      state.apps.push({id:Date.now(),jobId:j.id,wphone:u.phone,wname:u.name,wcat:u.skill,status:'applied',sample:false});
      store.set('apps2',state.apps);addNotif(t('applied_for')+' '+j.title);
      if(j.owner)addNotif(t('new_applicant')+' '+j.title+': '+u.name,j.owner);
    }
    state.modal=null;drawLayer();fillResults();toast(t('applied'));
  }
  else if(a==='hmic')listen(b,txt=>{state.q=txt;state.cat='';state.view='find';render();window.scrollTo(0,0)});
  else if(a==='goto'){e.preventDefault();captureReg();state.prev=state.view;state.view=v;render();window.scrollTo(0,0)}
  else if(a==='regrole'){resetAuth('register');state.auth.role=v;state.auth.step='form';state.view='register';render();window.scrollTo(0,0)}
  else if(a==='role'){state.auth.role=v;state.auth.step='form';render()}
  else if(a==='authback'){const x=state.auth;captureReg();if(x.step==='otp')x.step=x.mode==='register'?'form':'phone';else if(x.step==='form')x.step='role';render()}
  else if(a==='resend'){startOtp();render()}
  else if(a==='logout'){store.set('session','');state.user=null;state.view='landing';state.chat=[];state.cat='';state.q='';render();window.scrollTo(0,0);toast(t('logged_out'))}
  else if(a==='decide'){const ap=state.apps.find(x=>x.id===+b.dataset.i);if(ap){ap.status=v;store.set('apps2',state.apps);const j=state.jobs.find(x=>x.id===ap.jobId);if(j&&!ap.sample)addNotif(t(v==='accepted'?'job_accepted':'job_rejected')+' '+j.title,ap.wphone);render()}}
  else if(a==='callapp'){const ap=state.apps.find(x=>x.id===+v);if(ap)startCall({name:ap.wname,cat:ap.wcat})}
  else if(a==='closejob'){const j=state.jobs.find(x=>x.id===+v);if(j){j.closed=1;store.set('jobs',state.jobs);render()}}
  else if(a==='push'){try{Notification.requestPermission().then(render)}catch(err){}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){state.q=e.target.value;fillResults()}
  if(['r_phone','l_phone','o_code'].includes(e.target.id))e.target.value=e.target.value.replace(/\D/g,'').slice(0,e.target.id==='o_code'?6:10);
  if(e.target.id==='ok18'){$('#okbtn').disabled=!e.target.checked}
  if(e.target.name==='veh'){$('#dvbox').hidden=e.target.value!=='1'}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci'){e.preventDefault();sendChat(e.target.value,false);e.target.value=''}});
document.addEventListener('submit',e=>{
  const fid=e.target.id;
  if(fid==='hf'){e.preventDefault();state.q=($('#hq').value||'').trim();state.cat='';state.view='find';render();window.scrollTo(0,0);return}
  if(fid==='rf'||fid==='lf'||fid==='of'){e.preventDefault();return authSubmit(fid)}
  if(fid!=='pf')return;e.preventDefault();
  if(!state.user||state.user.role!=='employer')return;
  const g=id=>$('#'+id).value.trim();
  const veh=document.querySelector('input[name=veh]:checked').value==='1';
  const title=g('f_title'),loc=g('f_loc'),pay=+g('f_pay');
  if(!title||!loc||!pay)return toast(t('err_fill'));
  if(veh&&!$('#f_dv').checked)return toast(t('err_driver'));
  if(!$('#f_agree').checked)return toast(t('err_agree'));
  const job={id:Date.now(),title,cat:g('f_cat'),type:g('f_type'),pay,veh:veh?1:0,dv:veh?1:0,
    drink:+document.querySelector('input[name=drk]:checked').value,loc,need:+g('f_need')||1,emp:state.user.biz||state.user.name,owner:state.user.phone};
  state.jobs.unshift(job);store.set('jobs',state.jobs);
  const pool=WORKERS.filter(w=>w.cat===job.cat).slice(0,2);
  pool.forEach((w,i)=>state.apps.push({id:Date.now()+i+1,jobId:job.id,wphone:'sample-'+w.id,wname:w.name,wcat:w.cat,status:'applied',sample:true}));
  store.set('apps2',state.apps);
  addNotif(t('posted'));if(pool.length)addNotif(t('new_applicant')+' '+title+': '+pool[0].name);
  toast(t('posted'));state.view='myjobs';state.cat='';state.q='';render();window.scrollTo(0,0);
});

document.addEventListener('change',e=>{if(e.target.id==='lang'){captureReg();state.lang=e.target.value;store.set('lang',state.lang);state.chat=[];render()}});
state.user=state.users.find(u=>u.phone===store.get('session',''))||null;
state.view=state.user?'home':'landing';
resetAuth('login');
render();
</script>
</body>
</html>
