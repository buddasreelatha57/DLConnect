services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kaam_connect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kaam-connect-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaam_connect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kaam-connect-postgres:
